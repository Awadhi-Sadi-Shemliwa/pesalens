<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090C" />
    <title>PesaLens — Financial Intelligence for Tanzania</title>
    <meta name="description" content="Read your bank statement like an analyst. Tanzania-first personal finance." />

    <!-- SEO / social sharing. og:image must be an ABSOLUTE URL — scrapers
         (WhatsApp, Facebook, Twitter) don't resolve relative paths. -->
    <link rel="canonical" href="https://pesalens.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PesaLens" />
    <meta property="og:title" content="PesaLens — Financial Intelligence for Tanzania" />
    <meta property="og:description" content="Read your bank statement like an analyst. Tanzania-first personal finance." />
    <meta property="og:url" content="https://pesalens.com/" />
    <meta property="og:image" content="https://pesalens.com/pesalens-lockup.png" />
    <meta property="og:image:alt" content="PesaLens — rising market chart inside a lens" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PesaLens — Financial Intelligence for Tanzania" />
    <meta name="twitter:description" content="Read your bank statement like an analyst. Tanzania-first personal finance." />
    <meta name="twitter:image" content="https://pesalens.com/pesalens-lockup.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PesaLens",
        "url": "https://pesalens.com/",
        "description": "Read your bank statement like an analyst. Tanzania-first personal finance: statement analysis, bookkeeping, markets, and an AI assistant.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web, Android",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TZS", "description": "Free trial" }
      }
    </script>

    <!-- Google Analytics (GA4, gtag.js) — production only. The hostname gate
         keeps localhost/dev/preview traffic out of the property. SPA route
         changes are tracked from src/components/Router.jsx via
         src/data/analytics.js (initial load comes from this config call). -->
    <script>
      (function () {
        if (!/(^|\.)pesalens\.com$/.test(location.hostname)) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9Y6834CTPK';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-9Y6834CTPK');
      })();
    </script>

    <!-- PWA wiring — Chrome only fires `beforeinstallprompt` when the
         manifest, a registered service worker, and a 192/512 icon set
         are all present. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- `?v=2` busts the browser's own favicon cache — the old wallet icon
         was pinned by it (and by the SW's v1 precache) after the brand
         refresh replaced the files in place. Keep in step with
         CACHE_VERSION in public/sw.js. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png?v=2" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PesaLens" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pesalens-theme');
          if (t === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-deep text-txt-1">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
