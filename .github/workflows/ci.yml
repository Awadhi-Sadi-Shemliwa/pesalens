name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: backend / import-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Boot-smoke (imports + production-config check on dev defaults)
        run: python -c "from app.main import app; print('boot ok ->', app.title)"

  web:
    name: web / vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api

  mobile:
    name: mobile / vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PesaLens-MobileAPP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: PesaLens-MobileAPP/package-lock.json
      - run: npm ci
      - run: npm run build
