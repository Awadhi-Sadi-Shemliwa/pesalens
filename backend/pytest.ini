[pytest]
testpaths = tests

# Three suites are standalone scripts, not pytest modules — see each one's
# header for the invocation:
#
#     backend/venv/Scripts/python.exe backend/tests/test_transparency.py
#
# They drive ORDERED, stateful scenarios against a real database from their own
# main(): a user is created, asked for feedback, skips, is rewound past the
# snooze, skips again. The steps are functions taking hand-passed arguments
# (db, user, client) that pytest reads as fixture requests and cannot resolve,
# so collecting them yields 21 errors while running them directly passes.
#
# Ignored rather than ported because the ordering is load-bearing: run as
# independent pytest cases they would need session-scoped shared state to mean
# anything, and getting that wrong buys flaky CI in exchange for no new
# coverage. Port them when there is time to give each case its own fixtures.
#
# Everything else in tests/ collects and runs normally under both pytest and
# `python tests/<module>.py`.
addopts =
    --ignore=tests/test_feedback_prompting.py
    --ignore=tests/test_statement_linking.py
    --ignore=tests/test_transparency.py
