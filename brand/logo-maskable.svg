<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PesaLens — wallet (maskable)">
  <!--
    Maskable variant: the wallet is scaled to fit the central 80% safe
    zone so Android launchers can clip the icon into a circle / squircle
    / squared shape without cutting off the protruding note.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%"  stop-color="#3B5BDB" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#3B5BDB" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3B5BDB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="walletBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5577F8"/>
      <stop offset="100%" stop-color="#3B5BDB"/>
    </linearGradient>
    <linearGradient id="walletShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1F2A55" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1230" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="noteFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1ED38A"/>
      <stop offset="100%" stop-color="#0BAA66"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2A3F8F"/>
      <stop offset="100%" stop-color="#1B2A66"/>
    </linearGradient>
    <radialGradient id="clasp" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%"  stop-color="#FCE38A"/>
      <stop offset="55%" stop-color="#E0AC3C"/>
      <stop offset="100%" stop-color="#9C6E10"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Subject scaled to 70% (256-padding to centre) so the protruding
       note still survives a circle mask. translate keeps it centred. -->
  <g transform="translate(76.8 76.8) scale(0.7)">
    <g transform="translate(168 64)">
      <rect x="0" y="0" width="176" height="120" rx="10" ry="10"
            fill="url(#noteFace)" stroke="#087F4E" stroke-width="3"/>
      <rect x="10" y="10" width="156" height="100" rx="6" ry="6"
            fill="none" stroke="#0E5A3A" stroke-opacity="0.45"
            stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="88" cy="60" r="22"
              fill="none" stroke="#0E5A3A" stroke-opacity="0.55" stroke-width="3"/>
      <text x="88" y="69"
            font-family="'Fraunces','Georgia',serif"
            font-size="30" font-weight="700"
            text-anchor="middle"
            fill="#0E5A3A" fill-opacity="0.85">P</text>
      <text x="18" y="28" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#0E5A3A" fill-opacity="0.7">PL</text>
      <text x="158" y="104" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#0E5A3A" fill-opacity="0.7" text-anchor="end">PL</text>
    </g>
    <ellipse cx="256" cy="438" rx="160" ry="14" fill="#000" fill-opacity="0.32"/>
    <path d="M88 200 Q88 176 112 176 H400 Q424 176 424 200 V408 Q424 432 400 432 H112 Q88 432 88 408 Z"
          fill="url(#strap)"/>
    <path d="M104 200 Q104 188 116 188 H396 Q408 188 408 200 V408 Q408 420 396 420 H116 Q104 420 104 408 Z"
          fill="url(#walletBody)"/>
    <path d="M104 200 Q104 188 116 188 H396 Q408 188 408 200 V408 Q408 420 396 420 H116 Q104 420 104 408 Z"
          fill="url(#walletShade)"/>
    <path d="M124 232 H388" stroke="#0B1230" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
    <rect x="88" y="304" width="336" height="40" fill="url(#strap)"/>
    <rect x="88" y="304" width="336" height="2" fill="#0B1230" fill-opacity="0.4"/>
    <rect x="88" y="342" width="336" height="2" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="256" cy="324" r="14" fill="url(#clasp)" stroke="#5C3F0A" stroke-width="2"/>
    <circle cx="256" cy="324" r="4" fill="#5C3F0A"/>
    <path d="M124 400 H388" stroke="#0B1230" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
  </g>
</svg>
