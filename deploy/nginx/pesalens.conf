# PesaLens — single-origin NGINX server block.
#
# One domain serves BOTH halves of the app:
#   • the built Vite SPA (dist/) as static files, and
#   • the FastAPI backend, reverse-proxied under /api and /health.
#
# The backend runs in Docker and is published on the host loopback at
# 127.0.0.1:8000 (see docker-compose.yml). NGINX runs on the HOST
# (apt install nginx), not in a container — this matches the Contabo
# beginner guide and lets `certbot --nginx` manage TLS automatically.
#
# Install:
#   sudo cp deploy/nginx/pesalens.conf /etc/nginx/sites-available/pesalens.conf
#   sudo ln -s /etc/nginx/sites-available/pesalens.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default     # drop the welcome page
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (rewrites this file in place to add the :443 block +
# the http->https redirect):
#   sudo certbot --nginx -d pesalens.com -d www.pesalens.com

# Cap request bodies at the edge before they reach gunicorn (the
# backend itself caps at MAX_REQUEST_BODY_MB=60).
client_max_body_size 75M;

# The backend container, published on the host loopback by compose.
upstream pesalens_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    # Change this to whatever domain the SPA is served from. It must
    # match a DNS A record pointing at this VPS, and be present in the
    # backend's ALLOWED_ORIGINS / PUBLIC_APP_URL.
    server_name pesalens.com www.pesalens.com;

    # ---- Built SPA static files ----
    # Upload `dist/` here (see deploy guide): rsync ... dist/ -> /var/www/pesalens
    root /var/www/pesalens;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;
    gzip_min_length 1024;

    # ---- API: everything under /api -> FastAPI backend ----
    # proxy_pass has NO trailing path, so the full /api/... URI is
    # forwarded unchanged (the backend mounts every router at prefix=/api).
    location /api/ {
        proxy_pass http://pesalens_backend;
        proxy_http_version 1.1;

        # Forward the real client IP so slowapi rate-limits per user,
        # not per the single NGINX host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running PDF extractions can take ~2 min; match the
        # gunicorn --timeout set in backend/Dockerfile.
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---- Health endpoints (for uptime monitors / load balancers) ----
    location = /health       { proxy_pass http://pesalens_backend; }
    location = /health/ready { proxy_pass http://pesalens_backend; }

    # ---- Long-cache the hashed build assets ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached, or clients get stuck on
    # an old shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Serve APKs with the correct MIME so Android installs them instead
    # of treating the download as a generic ZIP.
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
    }

    # ---- SPA fallback: every other path returns index.html so the
    #      client-side router can take over (deep links, refresh). ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (defence-in-depth; the backend sets these too).
    # NOTE: certbot will add Strict-Transport-Security once TLS is on.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
